name: DownloadIn
options:
  bundleIdPrefix: com.kazamatech
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DownloadIn:
    type: application
    platform: iOS
    sources:
      - DownloadIn
    info:
      path: DownloadIn/Info.plist
      properties:
        CFBundleDisplayName: DownloadIn
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: DownloadIn menyimpan video dan foto hasil unduhan ke Foto.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.kazamatech.dlin.refresh]
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.kazamatech.dlin
            CFBundleURLSchemes: [downloadin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kazamatech.dlin
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: DownloadIn/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # IPA dibuat TANPA tanda tangan (ditandatangani oleh AltStore/Sideloadly milik pengguna)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_BITCODE: "NO"
